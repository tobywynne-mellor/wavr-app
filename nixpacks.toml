providers = ["node"]

[phases.setup]
nixPkgs = ['nodejs_18']  # Use Nixpkgs attribute naming (nodejs@18 is invalid)

[phases.install]
# Skip postinstall scripts to avoid phantomjs-prebuilt binary download on arm.
cmds = ['PHANTOMJS_SKIP_DOWNLOAD=true npm install --ignore-scripts']

[phases.build]
cmds = ['npm run build']

[start]
cmd = 'npm start'

[env]
NODE_ENV = "production"
NIXPACKS_NO_SELF_HOSTED_NIX = "1"  # Coolify self-hosted optimization
PHANTOMJS_SKIP_DOWNLOAD = "1"  # Avoid failing on arm64 where PhantomJS binaries are unavailable
